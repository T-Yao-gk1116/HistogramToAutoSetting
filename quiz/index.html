<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>知財管理クイズ（55問）</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --primary: #1a56db;
      --primary-dark: #1043a0;
      --secondary: #eef2ff;
      --correct: #16a34a;
      --correct-bg: #dcfce7;
      --correct-border: #86efac;
      --wrong: #dc2626;
      --wrong-bg: #fee2e2;
      --wrong-border: #fca5a5;
      --border: #d1d5db;
      --card-bg: #ffffff;
      --page-bg: #f3f4f6;
      --text: #111827;
      --text-muted: #6b7280;
      --radius: 10px;
      --shadow: 0 2px 8px rgba(0,0,0,.10);
    }

    body {
      font-family: "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      background: var(--page-bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.6;
    }

    /* ─── Header ─── */
    header {
      background: var(--primary);
      color: #fff;
      padding: 1rem 1.25rem;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 200;
      box-shadow: 0 2px 6px rgba(0,0,0,.2);
    }
    header h1 { font-size: clamp(1rem, 4vw, 1.5rem); letter-spacing: .03em; }

    /* ─── Progress bar ─── */
    #progress-wrap {
      background: #fff;
      padding: .5rem 1rem;
      display: flex;
      align-items: center;
      gap: .75rem;
      box-shadow: 0 1px 4px rgba(0,0,0,.08);
      position: sticky;
      top: 56px;
      z-index: 100;
    }
    #progress-label { font-size: .75rem; color: var(--text-muted); white-space: nowrap; }
    #progress-bar-outer {
      flex: 1;
      height: 8px;
      background: var(--border);
      border-radius: 99px;
      overflow: hidden;
    }
    #progress-bar-inner {
      height: 100%;
      background: var(--primary);
      border-radius: 99px;
      transition: width .4s;
      width: 0%;
    }
    #progress-count { font-size: .75rem; color: var(--text-muted); white-space: nowrap; }

    /* ─── Main layout ─── */
    main { max-width: 800px; margin: 0 auto; padding: 1.5rem 1rem 5rem; }

    /* ─── Screens ─── */
    .screen { display: none; }
    .screen.active { display: block; }

    /* ─── Start screen ─── */
    #start-screen {
      text-align: center;
      padding: 3rem 1rem;
    }
    .start-icon { font-size: 4rem; margin-bottom: 1rem; }
    .start-title { font-size: clamp(1.3rem, 4vw, 1.8rem); font-weight: 700; margin-bottom: .75rem; }
    .start-desc { color: var(--text-muted); line-height: 1.8; margin-bottom: 1.5rem; max-width: 480px; margin-left: auto; margin-right: auto; }
    .tag-cloud { display: flex; flex-wrap: wrap; gap: .5rem; justify-content: center; margin-bottom: 2rem; }
    .tag {
      background: var(--secondary);
      color: var(--primary);
      border: 1px solid #c7d7ff;
      border-radius: 99px;
      padding: .25rem .85rem;
      font-size: .8rem;
      font-weight: 600;
    }

    /* ─── Buttons ─── */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: .4rem;
      padding: .75rem 2rem;
      border: none;
      border-radius: var(--radius);
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: background .2s, transform .1s;
      text-decoration: none;
    }
    .btn:active { transform: scale(.97); }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-dark); }
    .btn-secondary { background: #e5e7eb; color: #374151; }
    .btn-secondary:hover { background: #d1d5db; }
    .btn-outline {
      background: transparent;
      border: 2px solid var(--primary);
      color: var(--primary);
    }
    .btn-outline:hover { background: var(--secondary); }

    /* ─── Quiz page ─── */
    .page-indicator {
      font-size: .85rem;
      color: var(--text-muted);
      margin-bottom: 1rem;
      font-weight: 600;
    }

    /* ─── Question card ─── */
    .q-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 1.25rem 1.5rem;
      margin-bottom: 1.25rem;
      box-shadow: var(--shadow);
      border: 1.5px solid var(--border);
    }
    .q-header {
      display: flex;
      align-items: flex-start;
      gap: .75rem;
      margin-bottom: 1rem;
    }
    .q-num {
      background: var(--primary);
      color: #fff;
      border-radius: 50%;
      width: 2rem;
      height: 2rem;
      min-width: 2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: .85rem;
      font-weight: 700;
    }
    .q-cat {
      font-size: .75rem;
      background: var(--secondary);
      color: var(--primary);
      border-radius: 99px;
      padding: .15rem .6rem;
      font-weight: 600;
      margin-bottom: .35rem;
      display: inline-block;
    }
    .q-text { font-size: 1rem; font-weight: 600; line-height: 1.6; }

    /* ─── Choices ─── */
    .choices { display: flex; flex-direction: column; gap: .6rem; }
    .choice-btn {
      width: 100%;
      text-align: left;
      padding: .75rem 1rem;
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      background: #fff;
      cursor: pointer;
      font-size: .95rem;
      line-height: 1.5;
      transition: border-color .15s, background .15s;
      display: flex;
      align-items: flex-start;
      gap: .6rem;
    }
    .choice-btn:hover:not(:disabled) {
      border-color: var(--primary);
      background: var(--secondary);
    }
    .choice-btn:disabled { cursor: default; }
    .choice-label {
      font-weight: 700;
      min-width: 1.4rem;
      color: var(--text-muted);
    }

    .choice-btn.correct {
      border-color: var(--correct-border);
      background: var(--correct-bg);
    }
    .choice-btn.correct .choice-label { color: var(--correct); }
    .choice-btn.wrong {
      border-color: var(--wrong-border);
      background: var(--wrong-bg);
    }
    .choice-btn.wrong .choice-label { color: var(--wrong); }

    /* ─── Explanation ─── */
    .explanation {
      margin-top: .85rem;
      padding: .85rem 1rem;
      border-radius: 8px;
      font-size: .9rem;
      line-height: 1.7;
      display: none;
    }
    .explanation.show { display: block; }
    .explanation.correct-exp {
      background: #f0fdf4;
      border-left: 4px solid var(--correct);
      color: #14532d;
    }
    .explanation.wrong-exp {
      background: #fff1f2;
      border-left: 4px solid var(--wrong);
      color: #7f1d1d;
    }
    .exp-title {
      font-weight: 700;
      margin-bottom: .3rem;
      display: flex;
      align-items: center;
      gap: .4rem;
    }

    /* ─── Navigation ─── */
    .nav-wrap {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      margin-top: 1.5rem;
      flex-wrap: wrap;
    }
    .nav-wrap > * { flex: 1; min-width: 120px; }
    .btn-next { text-align: right; }

    /* ─── Results screen ─── */
    #results-screen { padding-top: .5rem; }
    .score-hero {
      text-align: center;
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 2.5rem 1rem;
      margin-bottom: 1.5rem;
      box-shadow: var(--shadow);
    }
    .score-label { font-size: 1rem; color: var(--text-muted); margin-bottom: .25rem; }
    .score-value {
      font-size: clamp(3rem, 10vw, 5rem);
      font-weight: 900;
      color: var(--primary);
      line-height: 1;
    }
    .score-denom { font-size: 1.5rem; font-weight: 400; color: var(--text-muted); }
    .score-msg { margin-top: .75rem; font-size: 1.05rem; font-weight: 600; }
    .correct-count { font-size: .9rem; color: var(--text-muted); margin-top: .35rem; }

    /* ─── Category results ─── */
    .section-title {
      font-size: 1.1rem;
      font-weight: 700;
      margin: 1.5rem 0 .75rem;
      padding-left: .75rem;
      border-left: 4px solid var(--primary);
    }
    .chart-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }
    @media (max-width: 560px) {
      .chart-grid { grid-template-columns: 1fr; }
    }
    .chart-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 1rem;
      box-shadow: var(--shadow);
    }
    .chart-card canvas { width: 100% !important; }

    /* ─── Strength/Weakness list ─── */
    .analysis-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 1.25rem;
      box-shadow: var(--shadow);
      margin-bottom: 1rem;
    }
    .analysis-card h3 {
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: .75rem;
      display: flex;
      align-items: center;
      gap: .4rem;
    }
    .cat-row {
      display: flex;
      align-items: center;
      gap: .75rem;
      padding: .5rem 0;
      border-bottom: 1px solid #f3f4f6;
    }
    .cat-row:last-child { border-bottom: none; }
    .cat-name { flex: 1; font-size: .9rem; }
    .cat-bar-outer {
      width: 120px;
      height: 10px;
      background: #e5e7eb;
      border-radius: 99px;
      overflow: hidden;
    }
    .cat-bar-inner { height: 100%; border-radius: 99px; }
    .cat-pct { font-size: .85rem; font-weight: 700; min-width: 3.5rem; text-align: right; }
    .tip-box {
      background: #fefce8;
      border: 1px solid #fde047;
      border-radius: 8px;
      padding: .75rem 1rem;
      font-size: .85rem;
      line-height: 1.6;
      margin-top: .5rem;
    }

    /* ─── Retry button ─── */
    .retry-wrap { text-align: center; margin-top: 2rem; }

    /* ─── Mobile tweaks ─── */
    @media (max-width: 480px) {
      .q-card { padding: 1rem; }
      .choice-btn { font-size: .88rem; padding: .65rem .85rem; }
      .nav-wrap { flex-direction: column; }
      .nav-wrap > * { min-width: unset; width: 100%; }
      .btn-next { text-align: center; }
      .cat-bar-outer { width: 80px; }
    }
  </style>
</head>
<body>
<header>
  <h1>📚 知財管理クイズ（55問）</h1>
</header>

<div id="progress-wrap">
  <span id="progress-label">回答済み</span>
  <div id="progress-bar-outer"><div id="progress-bar-inner"></div></div>
  <span id="progress-count">0 / 55</span>
</div>

<main>
  <!-- ─── Start Screen ─── -->
  <div id="start-screen" class="screen active">
    <div class="start-icon">📝</div>
    <div class="start-title">知財管理 実力チェック</div>
    <p class="start-desc">
      特許法・実用新案法・意匠法・商標法・著作権法など<br>
      知的財産に関する全55問にチャレンジしましょう！<br>
      10問ごとにページが変わり、最後に結果を分析します。
    </p>
    <div class="tag-cloud">
      <span class="tag">特許法 15問</span>
      <span class="tag">実用新案法 5問</span>
      <span class="tag">意匠法 6問</span>
      <span class="tag">商標法 8問</span>
      <span class="tag">著作権法 8問</span>
      <span class="tag">不正競争防止法 5問</span>
      <span class="tag">国際条約・制度 5問</span>
      <span class="tag">知財管理実務 3問</span>
    </div>
    <button class="btn btn-primary" onclick="startQuiz()">▶ クイズを開始する</button>
  </div>

  <!-- ─── Quiz Screen ─── -->
  <div id="quiz-screen" class="screen">
    <div id="page-indicator" class="page-indicator"></div>
    <div id="questions-container"></div>
    <div class="nav-wrap">
      <div>
        <button id="btn-prev" class="btn btn-secondary" onclick="prevPage()">← 前のページ</button>
      </div>
      <div class="btn-next">
        <button id="btn-next" class="btn btn-primary" onclick="nextPage()">次のページ →</button>
      </div>
    </div>
  </div>

  <!-- ─── Results Screen ─── -->
  <div id="results-screen" class="screen">
    <div class="score-hero">
      <div class="score-label">あなたのスコア</div>
      <div class="score-value" id="score-value">0<span class="score-denom">/100</span></div>
      <div class="score-msg" id="score-msg"></div>
      <div class="correct-count" id="correct-count"></div>
    </div>

    <div class="section-title">📊 カテゴリ別 正答率グラフ</div>
    <div class="chart-grid">
      <div class="chart-card">
        <canvas id="radar-chart"></canvas>
      </div>
      <div class="chart-card">
        <canvas id="bar-chart"></canvas>
      </div>
    </div>

    <div class="section-title">✅ 得意分野（正答率 70%以上）</div>
    <div class="analysis-card" id="strengths-card">
      <div id="strengths-list"></div>
    </div>

    <div class="section-title">⚠️ 苦手分野（正答率 70%未満）</div>
    <div class="analysis-card" id="weaknesses-card">
      <div id="weaknesses-list"></div>
    </div>

    <div class="retry-wrap">
      <button class="btn btn-outline" onclick="retryQuiz()">🔄 もう一度チャレンジ</button>
    </div>
  </div>
</main>

<script>
const QUESTIONS = [
  // ── 特許法 (1–15) ──────────────────────────────────────────
  {
    cat: "特許法",
    q: "特許法における「発明」の定義として最も正確なものはどれか。",
    choices: [
      "自然法則を利用した技術的思想の創作のうち高度のもの",
      "自然法則を利用した技術的思想の創作",
      "技術的思想の創作のうち高度のもの",
      "自然法則そのものの発見"
    ],
    answer: 0,
    explain: "特許法第2条第1項は、発明を「自然法則を利用した技術的思想の創作のうち高度のもの」と定義します。単なる「技術的思想の創作」（高度性を問わない）は実用新案の保護対象です。数学的公式や自然法則そのものは発明に含まれません。"
  },
  {
    cat: "特許法",
    q: "特許権の存続期間の起算点と期間の組み合わせとして正しいものはどれか。",
    choices: [
      "登録日から20年",
      "出願日から20年",
      "出願日から25年",
      "登録日から25年"
    ],
    answer: 1,
    explain: "特許法第67条により、特許権の存続期間は特許出願日から20年です。医薬品・農薬など一定の場合は、最長5年の延長登録制度があります（第67条の2）。"
  },
  {
    cat: "特許法",
    q: "特許出願は原則として出願日から何ヶ月後に公開されるか。",
    choices: [
      "出願日から12ヶ月後",
      "出願日から18ヶ月後",
      "出願日から24ヶ月後",
      "審査請求日から12ヶ月後"
    ],
    answer: 1,
    explain: "特許法第64条（出願公開）により、特許出願は、その出願の日（優先権主張がある場合は最先の優先日）から1年6ヶ月（18ヶ月）を経過したときに公開されます。出願人が早期公開を望む場合は出願公開の請求ができます。"
  },
  {
    cat: "特許法",
    q: "特許出願の審査請求期間として正しいものはどれか。",
    choices: [
      "出願日から1年以内",
      "出願日から3年以内",
      "出願日から5年以内",
      "公開日から3年以内"
    ],
    answer: 1,
    explain: "特許法第48条の3により、特許出願の審査請求は出願の日から3年以内に行わなければなりません。この期間内に審査請求が行われない場合、出願は取り下げたものとみなされます（みなし取下げ）。"
  },
  {
    cat: "特許法",
    q: "特許法における新規性喪失の例外（グレースピリオド）の適用期間はどれか。",
    choices: [
      "公表日から3ヶ月以内",
      "公表日から6ヶ月以内",
      "公表日から1年以内",
      "公表日から2年以内"
    ],
    answer: 2,
    explain: "特許法第30条（新規性喪失の例外）では、発明者や出願人等が公表した発明について、公表日から1年以内に特許出願すれば新規性・進歩性の判断において公表前の状態として扱われます（2012年の改正で6ヶ月から1年に延長されました）。"
  },
  {
    cat: "特許法",
    q: "特許権の効力が及ばない行為として、特許法が明示しているものはどれか。",
    choices: [
      "業として特許発明を製造する行為",
      "試験・研究のためにする特許発明の実施",
      "特許製品を国内で販売する行為",
      "特許発明を利用した新製品の開発"
    ],
    answer: 1,
    explain: "特許法第69条第1項は「特許権の効力は、試験又は研究のためにする特許発明の実施には、及ばない」と規定しています。これにより、学術目的の実験や研究開発段階の実施は侵害に当たりません。"
  },
  {
    cat: "特許法",
    q: "職務発明について特許法が定める内容として正しいものはどれか。",
    choices: [
      "会社が行った職務発明の特許を受ける権利は当然に会社に帰属する",
      "従業者が行った職務発明の特許を受ける権利は、契約・勤務規則等で会社に帰属させることができる",
      "職務発明の特許を受ける権利は、常に発明した従業者に帰属する",
      "職務発明に係る特許権は、必ず会社と発明者の共有となる"
    ],
    answer: 1,
    explain: "特許法第35条（職務発明）では、従業者が行った職務発明について、使用者が契約・勤務規則等で予め特許を受ける権利を使用者に帰属させる旨を定めることができます（2015年改正）。会社帰属の場合、発明者には相当の金銭的利益を与えなければなりません。"
  },
  {
    cat: "特許法",
    q: "先使用権（先使用による通常実施権）が認められる要件として正しいものはどれか。",
    choices: [
      "他人の特許出願と同日以前から日本国内で発明の実施をしていること",
      "他人の特許出願の際に日本国内でその発明の実施をする事業をしていること、またはその事業の準備をしていること",
      "他人の特許権が存続期間満了になった後に実施を開始していること",
      "特許出願の公開前から発明の実施事業をしていること"
    ],
    answer: 1,
    explain: "特許法第79条（先使用権）は、特許出願の際に国内でその発明の実施をする事業またはその準備をしていた者に、その実施・準備の範囲内で通常実施権を認めます。この権利は実施または準備していた事業に附随するため、事業と一緒でなければ移転できません。"
  },
  {
    cat: "特許法",
    q: "専用実施権と通常実施権の違いとして正しいものはどれか。",
    choices: [
      "専用実施権者は特許権者の許可なく第三者に再実施権を設定できる",
      "通常実施権者は特許権者に無断で特許発明を独占的に実施できる",
      "専用実施権者は設定された範囲で独占的に実施でき、特許権者も実施できなくなる場合がある",
      "通常実施権には登録が必要で、専用実施権には登録は不要である"
    ],
    answer: 2,
    explain: "専用実施権（第77条）は設定された範囲で独占的な実施権であり、専用実施権者が設定された範囲について特許権者も実施できなくなります。通常実施権（第78条）は非独占的で複数設定可能です。専用実施権には特許原簿への登録が効力要件です。"
  },
  {
    cat: "特許法",
    q: "特許無効審判について正しいものはどれか。",
    choices: [
      "特許権の存続期間中のみ請求できる",
      "何人も、特許権の消滅後も請求することができる",
      "特許権者のみが自己の特許に対して請求できる",
      "審判の請求期間は特許設定登録日から5年以内に限られる"

const PAGE_SIZE = 10;
const TOTAL = QUESTIONS.length; // 55

// State
let answers = new Array(TOTAL).fill(null); // null = unanswered, index = chosen
let currentPage = 0;
const totalPages = Math.ceil(TOTAL / PAGE_SIZE);

function getPageQuestions(page) {
  const start = page * PAGE_SIZE;
  return QUESTIONS.slice(start, Math.min(start + PAGE_SIZE, TOTAL));
}

function updateProgress() {
  const answered = answers.filter(a => a !== null).length;
  const pct = (answered / TOTAL) * 100;
  document.getElementById('progress-bar-inner').style.width = pct + '%';
  document.getElementById('progress-count').textContent = answered + ' / ' + TOTAL;
}

function startQuiz() {
  answers = new Array(TOTAL).fill(null);
  currentPage = 0;
  showScreen('quiz-screen');
  renderPage(currentPage);
  updateProgress();
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0, 0);
}

function renderPage(page) {
  const qs = getPageQuestions(page);
  const startIdx = page * PAGE_SIZE;
  const container = document.getElementById('questions-container');
  
  document.getElementById('page-indicator').textContent =
    'ページ ' + (page + 1) + ' / ' + totalPages + '（第' + (startIdx + 1) + '問〜第' + Math.min(startIdx + qs.length, TOTAL) + '問）';

  container.innerHTML = '';
  qs.forEach((q, localIdx) => {
    const globalIdx = startIdx + localIdx;
    const card = document.createElement('div');
    card.className = 'q-card';
    card.id = 'qcard-' + globalIdx;
    
    const choicesHtml = q.choices.map((choice, ci) => {
      const labels = ['Ａ', 'Ｂ', 'Ｃ', 'Ｄ'];
      const chosen = answers[globalIdx];
      let btnClass = 'choice-btn';
      if (chosen !== null) {
        if (ci === q.answer) btnClass += ' correct';
        else if (ci === chosen && ci !== q.answer) btnClass += ' wrong';
      }
      const disabled = chosen !== null ? 'disabled' : '';
      return \`<button class="\${btnClass}" \${disabled} onclick="selectAnswer(\${globalIdx}, \${ci})">
        <span class="choice-label">\${labels[ci]}</span>
        <span>\${escHtml(choice)}</span>
      </button>\`;
    }).join('');

    const chosen = answers[globalIdx];
    let expHtml = '';
    if (chosen !== null) {
      const isCorrect = chosen === q.answer;
      const expClass = isCorrect ? 'correct-exp' : 'wrong-exp';
      const expTitle = isCorrect ? '✅ 正解です！' : '❌ 不正解です';
      const correctLabel = ['Ａ', 'Ｂ', 'Ｃ', 'Ｄ'][q.answer];
      expHtml = \`<div class="explanation show \${expClass}">
        <div class="exp-title">\${expTitle}\${isCorrect ? '' : '（正解：\${correctLabel}）'}</div>
        <div>\${escHtml(q.explain)}</div>
      </div>\`;
    }

    card.innerHTML = \`
      <div class="q-header">
        <div class="q-num">\${globalIdx + 1}</div>
        <div>
          <div class="q-cat">\${escHtml(q.cat)}</div>
          <div class="q-text">\${escHtml(q.q)}</div>
        </div>
      </div>
      <div class="choices">\${choicesHtml}</div>
      \${expHtml}
    \`;
    container.appendChild(card);
  });

  // Nav buttons
  document.getElementById('btn-prev').style.display = page === 0 ? 'none' : '';
  const isLastPage = page === totalPages - 1;
  const nextBtn = document.getElementById('btn-next');
  nextBtn.textContent = isLastPage ? '結果を見る ✨' : '次のページ →';
  
  window.scrollTo(0, 0);
}

function escHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function selectAnswer(globalIdx, choiceIdx) {
  if (answers[globalIdx] !== null) return;
  answers[globalIdx] = choiceIdx;
  updateProgress();

  // Re-render just this card
  const q = QUESTIONS[globalIdx];
  const card = document.getElementById('qcard-' + globalIdx);
  const buttons = card.querySelectorAll('.choice-btn');
  const labels = ['Ａ', 'Ｂ', 'Ｃ', 'Ｄ'];

  buttons.forEach((btn, ci) => {
    btn.disabled = true;
    btn.className = 'choice-btn';
    if (ci === q.answer) btn.className += ' correct';
    else if (ci === choiceIdx && ci !== q.answer) btn.className += ' wrong';
  });

  const isCorrect = choiceIdx === q.answer;
  const expClass = isCorrect ? 'correct-exp' : 'wrong-exp';
  const expTitle = isCorrect ? '✅ 正解です！' : '❌ 不正解です';
  const correctLabel = labels[q.answer];

  const expDiv = document.createElement('div');
  expDiv.className = 'explanation show ' + expClass;
  expDiv.innerHTML = \`<div class="exp-title">\${expTitle}\${isCorrect ? '' : '（正解：\${correctLabel}）'}</div><div>\${escHtml(q.explain)}</div>\`;

  // Remove existing explanation if any
  const existing = card.querySelector('.explanation');
  if (existing) existing.remove();
  card.appendChild(expDiv);

  // Smooth scroll to explanation
  setTimeout(() => expDiv.scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 50);
}

function prevPage() {
  if (currentPage > 0) {
    currentPage--;
    renderPage(currentPage);
  }
}

function nextPage() {
  if (currentPage < totalPages - 1) {
    currentPage++;
    renderPage(currentPage);
  } else {
    showResults();
  }
}

// ─── Results ───

function showResults() {
  showScreen('results-screen');
  
  // Calculate scores
  let correctTotal = 0;
  const catStats = {}; // cat -> { correct, total }

  QUESTIONS.forEach((q, i) => {
    const cat = q.cat;
    if (!catStats[cat]) catStats[cat] = { correct: 0, total: 0 };
    catStats[cat].total++;
    if (answers[i] === q.answer) {
      correctTotal++;
      catStats[cat].correct++;
    }
  });

  const score = Math.round((correctTotal / TOTAL) * 100);
  
  document.getElementById('score-value').innerHTML =
    score + '<span class="score-denom">/100</span>';
  document.getElementById('correct-count').textContent =
    '正解数: ' + correctTotal + ' / ' + TOTAL + '問';

  let msg = '';
  if (score >= 90) msg = '🏆 素晴らしい！知財管理のエキスパートです！';
  else if (score >= 75) msg = '🎉 優秀！知財の基礎がしっかり身についています。';
  else if (score >= 60) msg = '👍 合格圏！苦手分野を重点的に復習しましょう。';
  else if (score >= 40) msg = '📖 もう少し！基本的な知識を復習してみましょう。';
  else msg = '💪 知財の学習を一からスタートしましょう！';
  document.getElementById('score-msg').textContent = msg;

  const cats = Object.keys(catStats);
  const pcts = cats.map(c => Math.round((catStats[c].correct / catStats[c].total) * 100));
  const colors = [
    '#1a56db','#059669','#d97706','#7c3aed','#db2777','#0891b2','#65a30d','#9f1239'
  ];

  // Radar chart
  const radarCtx = document.getElementById('radar-chart').getContext('2d');
  new Chart(radarCtx, {
    type: 'radar',
    data: {
      labels: cats.map(c => c.replace('・', '・\n')),
      datasets: [{
        label: '正答率 (%)',
        data: pcts,
        borderColor: '#1a56db',
        backgroundColor: 'rgba(26,86,219,.15)',
        pointBackgroundColor: '#1a56db',
        borderWidth: 2,
      }]
    },
    options: {
      responsive: true,
      plugins: {
        legend: { display: false },
        title: { display: true, text: 'カテゴリ別 正答率（レーダー）', font: { size: 13 } }
      },
      scales: {
        r: {
          min: 0, max: 100,
          ticks: { stepSize: 25, font: { size: 10 } },
          pointLabels: { font: { size: 10 } }
        }
      }
    }
  });

  // Bar chart
  const barCtx = document.getElementById('bar-chart').getContext('2d');
  new Chart(barCtx, {
    type: 'bar',
    data: {
      labels: cats,
      datasets: [{
        label: '正答率 (%)',
        data: pcts,
        backgroundColor: cats.map((_, i) => colors[i % colors.length] + 'cc'),
        borderColor: cats.map((_, i) => colors[i % colors.length]),
        borderWidth: 1,
        borderRadius: 5,
      }]
    },
    options: {
      responsive: true,
      indexAxis: 'y',
      plugins: {
        legend: { display: false },
        title: { display: true, text: 'カテゴリ別 正答率（棒グラフ）', font: { size: 13 } }
      },
      scales: {
        x: { min: 0, max: 100, ticks: { callback: v => v + '%' } },
        y: { ticks: { font: { size: 10 } } }
      }
    }
  });

  // Strengths & Weaknesses
  const strengths = cats.filter((c, i) => pcts[i] >= 70);
  const weaknesses = cats.filter((c, i) => pcts[i] < 70);

  const TIPS = {
    '特許法': '特許法の手続き（出願→審査→登録）の流れと各期間を確認しましょう。第29条（新規性・進歩性）と第35条（職務発明）は頻出です。',
    '実用新案法': '特許法との違い（無審査主義・物品限定・存続期間10年）を整理しましょう。',
    '意匠法': '意匠の定義・関連意匠・秘密意匠・存続期間25年（出願日起算）を押さえましょう。',
    '商標法': '商標の種類（立体・音）、不使用取消審判、先使用権を重点的に学習しましょう。',
    '著作権法': '著作権の発生要件・保護期間・著作隣接権・フェアユースに相当する権利制限規定を確認しましょう。',
    '不正競争防止法': '営業秘密の3要件（秘密管理性・有用性・非公知性）と不正競争類型を整理しましょう。',
    '国際条約・制度': 'パリ条約・PCT・マドリッド協定・ハーグ協定の特徴と優先権期間の違いを確認しましょう。',
    '知財管理実務': 'パテントマップの活用方法とオープン＆クローズ戦略の概念を復習しましょう。',
  };

  function renderCatList(containerId, catList, showTip) {
    const el = document.getElementById(containerId);
    if (catList.length === 0) {
      el.innerHTML = '<p style="color:var(--text-muted);font-size:.9rem;">該当なし</p>';
      return;
    }
    el.innerHTML = catList.map(cat => {
      const idx = cats.indexOf(cat);
      const pct = pcts[idx];
      const color = pct >= 70 ? '#16a34a' : pct >= 40 ? '#d97706' : '#dc2626';
      const tip = showTip && TIPS[cat] ? \`<div class="tip-box">💡 <b>学習ヒント：</b>\${escHtml(TIPS[cat])}</div>\` : '';
      return \`<div class="cat-row">
        <span class="cat-name">\${escHtml(cat)}</span>
        <div class="cat-bar-outer">
          <div class="cat-bar-inner" style="width:\${pct}%;background:\${color}"></div>
        </div>
        <span class="cat-pct" style="color:\${color}">\${pct}%</span>
      </div>\${tip}\`;
    }).join('');
  }

  renderCatList('strengths-list', strengths, false);
  renderCatList('weaknesses-list', weaknesses, true);
}

function retryQuiz() {
  answers = new Array(TOTAL).fill(null);
  currentPage = 0;
  updateProgress();
  showScreen('start-screen');
}

// Init
updateProgress();
</script>
